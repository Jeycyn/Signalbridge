<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SignalBridge</title>
    <meta name="description" content="Climate and weather risk intelligence progressive web application." />
    <meta property="og:title" content="SignalBridge" />
    <meta property="og:description" content="Climate and weather risk intelligence progressive web application." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SignalBridge" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script>
      // Runtime constraint: HMR is disabled in AI Studio preview. Ignore WebSocket and HMR connection errors.
      (function() {
        var isIgnored = function(val) {
          if (!val) return false;
          var str = typeof val === 'string' ? val : (val.message || String(val));
          return str.includes('WebSocket') ||
                 str.includes('websocket') ||
                 str.includes('vite:ws') ||
                 str.includes('[vite] failed to connect to websocket') ||
                 str.includes('SendBeforeConnectError') ||
                 str.includes('send was called before connect');
        };

        var origConsoleError = console.error;
        console.error = function() {
          if (isIgnored(arguments[0])) return;
          origConsoleError.apply(console, arguments);
        };

        window.addEventListener('error', function(event) {
          if (isIgnored(event.message) || isIgnored(event.error)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (isIgnored(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
