<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="104" fill="#0f172a"/>
  <!-- Subtle coordinate grid lines -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1e293b" stroke-width="2"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#1e293b" stroke-width="2"/>
  <circle cx="256" cy="256" r="60" fill="none" stroke="#1e293b" stroke-width="2"/>
  <line x1="256" y1="76" x2="256" y2="436" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="76" y1="256" x2="436" y2="256" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4"/>
  
  <!-- Signal radar waves (Teal & Navy contrast) -->
  <path d="M 170 300 A 110 110 0 0 1 342 300" fill="none" stroke="#0ea5e9" stroke-width="16" stroke-linecap="round"/>
  <path d="M 205 270 A 65 65 0 0 1 307 270" fill="none" stroke="#14b8a6" stroke-width="14" stroke-linecap="round"/>
  
  <!-- Bridge / Sensor Node point -->
  <circle cx="256" cy="240" r="18" fill="#38bdf8"/>
  <circle cx="256" cy="240" r="8" fill="#ffffff"/>
  
  <!-- Ground baseline & bridge truss accents -->
  <path d="M 130 360 L 382 360" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  <path d="M 170 360 L 256 240 L 342 360" fill="none" stroke="#0ea5e9" stroke-width="6" stroke-linejoin="round"/>
  <path d="M 213 360 L 256 300 L 299 360" fill="none" stroke="#14b8a6" stroke-width="4" stroke-linejoin="round"/>
</svg>
